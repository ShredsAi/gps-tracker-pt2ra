spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gps_ingestion_dev
    username: dev_user
    password: dev_password
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    ai.shreds: DEBUG
    org.springframework: DEBUG
    io.netty: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Enable all actuator endpoints for development
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

# Development-specific Netty settings
netty:
  tcp:
    debug: true
    connection-timeout: 60000
  udp:
    debug: true
